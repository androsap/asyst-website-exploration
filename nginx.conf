# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Kompresi teks (JS/CSS/HTML/JSON/SVG); default image nginx:latest tidak meng-gzip. JS/CSS jadi ~1/3 ukuran.
    gzip                on;
    gzip_vary           on;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_proxied        any;
    gzip_types          text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        root         /usr/share/nginx/html;

        location / {
        }
    }

    server {
        listen          3000;
        server_name     frontend;
        root            /usr/share/nginx/apps;
        add_header      X-Frame-Options "SAMEORIGIN";
        add_header      Content-Security-Policy "frame-ancestors 'self';";

        
        location /configs {
            proxy_pass http://103.126.57.142:8282/api/config;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /maintenances {
            proxy_pass http://103.126.57.142:8282/api/maintenance;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # location /socket.io {
            # proxy_pass http://103.126.57.142:8282/socket.io/?$args;
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;
            # proxy_set_header X-Forwarded-Host $host;
            # proxy_set_header X-Forwarded-Port $server_port;
        # }

        # add_header di dalam location menimpa add_header milik server, jadi header keamanan diulang
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN";
            add_header Content-Security-Policy "frame-ancestors 'self';";
        }

        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN";
            add_header Content-Security-Policy "frame-ancestors 'self';";
        }

        # File hasil build Vite sudah ber-hash, aman di-cache lama
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Frame-Options "SAMEORIGIN";
            add_header Content-Security-Policy "frame-ancestors 'self';";
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }

        error_page 404 /404.html;
            location = /404.html {
        }
    }
}

