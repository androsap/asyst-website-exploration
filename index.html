        // Stub/queue tetap dibuat langsung, jadi event yang dikirim sebelum script termuat tidak hilang.
        (function () {
            var queue = [], loaded = false;
            var events = ['pointerdown', 'keydown', 'touchstart', 'scroll', 'mousemove'];
            var inject = function (src) {
                var s = document.createElement('script'); s.async = true; s.src = src;
                document.head.appendChild(s);
            };
            var loadAll = function () {
                if (loaded) return;
                loaded = true;
                events.forEach(function (e) { window.removeEventListener(e, loadAll, true) });
                queue.forEach(inject);
            };
            events.forEach(function (e) { window.addEventListener(e, loadAll, { capture: true, passive: true }) });
            window.addEventListener('load', function () { setTimeout(loadAll, 5000) });
            window.loadDeferred = function (src) { loaded ? inject(src) : queue.push(src) };
        })();
    </script>
